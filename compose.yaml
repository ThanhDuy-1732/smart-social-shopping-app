services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: shopping
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
      POSTGRES_DB: shopping
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - shopping_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  shopping_pg:
