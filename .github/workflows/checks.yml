name: checks
on: [push, pull_request]
jobs:
  local-acceptance:
    runs-on: ubuntu-latest
    container: node:24-bookworm
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: shopping
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: shopping_test
        options: >-
          --health-cmd "pg_isready -U shopping -d shopping_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 18 client and media tools
        run: |
          apt-get update
          apt-get install -y ca-certificates curl gnupg ffmpeg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo 'deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt bookworm-pgdg main' > /etc/apt/sources.list.d/pgdg.list
          apt-get update
          apt-get install -y postgresql-client-18
      - run: npm ci
      - name: Create isolated test configuration
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          import {randomBytes} from 'node:crypto';
          const config=`DATABASE_URL=postgresql://shopping:ci-only-password@postgres:5432/shopping_test\nBETTER_AUTH_SECRET=${randomBytes(32).toString('base64url')}\nBETTER_AUTH_URL=http://127.0.0.1:14387\nMAIL_TRANSPORT=local\n`;
          for(const file of ['.env.local','.env.test'])writeFileSync(file,config,{mode:0o600});
          JS
      - run: npm run db:migrate
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 3
